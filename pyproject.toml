[project]
name = "historian"
version = "0.1.0"
description = "A SQL query engine over git history"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
historian = "historian.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/historian"]
